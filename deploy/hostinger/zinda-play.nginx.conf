server {
    listen 80;
    server_name zindaplay.com www.zindaplay.com;
    root /var/www/zinda-play/current/client/dist;
    index index.html;

    access_log /var/log/nginx/zinda-play-web.access.log;
    error_log /var/log/nginx/zinda-play-web.error.log;
    client_max_body_size 2G;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zinda-play/acme;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        include /var/www/zinda-play/config/proxy.conf;
    }

    location /share/video/ {
        proxy_pass http://127.0.0.1:4100/api/share/video/;
        include /var/www/zinda-play/config/proxy.conf;
    }

    location /share/creator/ {
        proxy_pass http://127.0.0.1:4100/api/share/creator/;
        include /var/www/zinda-play/config/proxy.conf;
    }

    location /join/ {
        proxy_pass http://127.0.0.1:4100/api/share/join/;
        include /var/www/zinda-play/config/proxy.conf;
    }

    location = /downloads/zinda-play.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="zinda-play.apk"';
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location = /downloads/zinda-play.apk.sha256 {
        default_type text/plain;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name api.zindaplay.com;

    access_log /var/log/nginx/zinda-play-api.access.log;
    error_log /var/log/nginx/zinda-play-api.error.log;
    client_max_body_size 2G;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/zinda-play/acme;
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        include /var/www/zinda-play/config/proxy.conf;
    }
}
